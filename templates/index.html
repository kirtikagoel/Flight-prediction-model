<!DOCTYPE html>
<html>
<head>
    <title>Flight Price Predictor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4e73df, #1cc88a);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 450px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            margin-top: 10px;
            display: block;
        }

        select, input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .row div {
            flex: 1;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }

        .predict-btn {
            background: #4e73df;
            color: white;
        }

        .predict-btn:hover {
            background: #2e59d9;
        }

        .reset-btn {
            background: #858796;
            color: white;
            margin-top: 10px;
        }

        .result-card {
            margin-top: 20px;
            padding: 15px;
            background: #e6f9f0;
            border-left: 5px solid #1cc88a;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>✈ Smart Flight Price Predictor</h2>

    <form action="/predict" method="post">

        <label>Trip Type</label>
        <select name="trip_type">
            <option value="1">One Way</option>
            <option value="2">Round Trip</option>
        </select>

        <label>Airline</label>
        <select name="airline">
            <option value="1">IndiGo</option>
            <option value="2">Air India</option>
            <option value="3">SpiceJet</option>
        </select>

        <label>Source</label>
        <select name="source">
            <option value="1">Delhi</option>
            <option value="2">Mumbai</option>
            <option value="3">Kolkata</option>
            <option value="4">Chennai</option>
            <option value="5">Bangalore</option>
        </select>

        <label>Destination</label>
        <select name="destination">
            <option value="1">Delhi</option>
            <option value="2">Mumbai</option>
            <option value="3">Kolkata</option>
            <option value="4">Chennai</option>
            <option value="5">Bangalore</option>
        </select>

        <label>Stops</label>
        <select name="stops">
            <option value="0">Non-stop</option>
            <option value="1">1 Stop</option>
            <option value="2">2 Stops</option>
        </select>

        <label>Journey Date</label>
        <input type="date" name="journey_date" required>

        <label>Duration</label>
        <div class="row">
            <div>
                <input type="number" name="hours" placeholder="Hours" required>
            </div>
            <div>
                <input type="number" name="minutes" placeholder="Minutes" required>
            </div>
        </div>

        <button type="submit" class="predict-btn">Predict Price 💰</button>
        <button type="reset" class="reset-btn">Reset</button>
    </form>

    {% if prediction_text %}
        <div class="result-card">
            {{ prediction_text }}
        </div>
    {% endif %}
</div>

</body>
</html>
